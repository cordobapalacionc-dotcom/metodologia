# Blueprint de Render para Quibdó Conecta
# Desplegar: https://dashboard.render.com/blueprint/new?repo=https://github.com/cordobapalacionc-dotcom/metodologia
services:
  - type: web
    name: quibdo-conecta
    runtime: node
    plan: free
    region: oregon
    # El backend (Express) sirve también el frontend estático desde ../frontend
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Correo(s) que serán administradores al registrarse (separados por comas)
      - key: ADMIN_CORREOS
        sync: false
      # Base de datos PostgreSQL de Supabase (los datos ya no se borran al reiniciar).
      # Supabase → Connect → "Session pooler" → copiar la URI y poner la contraseña real.
      - key: DATABASE_URL
        sync: false
      # Dirección pública: la llevan los códigos QR de los certificados
      - key: URL_PUBLICA
        value: https://quibdo-conecta.onrender.com
